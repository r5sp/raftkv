[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raftkv"
version = "0.1.0"
description = "A fault-tolerant, linearizable key-value store built on the Raft consensus algorithm (Python asyncio)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ronit Peswani" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
raftkv-server = "raftkv.server:main"
raftkv-cli = "raftkv.cli:main"

[tool.setuptools.packages.find]
include = ["raftkv*"]

[tool.setuptools.package-data]
raftkv = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4"]
ignore = ["RUF012", "E501", "ASYNC109", "PT018"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["raftkv", "tests"]
mypy_path = "tests"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: long-running soak tests (run with: pytest -m slow)",
]
